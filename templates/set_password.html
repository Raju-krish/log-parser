{% extends "base.html" %}
{% block title %}Log Parser — Set password{% endblock %}
{% block content %}

<div class="login-page">
  <div class="login-box">
    <div class="login-brand">
      <div class="login-logo">◧</div>
      <h1>LOG <span>PARSER</span></h1>
      <p class="login-sub">Set a password for <strong>{{ username }}</strong> to finish signing in.</p>
    </div>

    <form method="POST" action="{{ url_for('set_password') }}" class="login-form">
      <input type="hidden" name="username" value="{{ username }}" />
      <input type="hidden" name="next" value="{{ next_url }}" />

      <div class="lf-field">
        <label for="password">New password</label>
        <div class="lf-input">
          <input type="password" id="password" name="password" autocomplete="new-password"
                 placeholder="at least 6 characters" autofocus required />
          <button type="button" class="lf-toggle" id="pw-toggle" tabindex="-1">show</button>
        </div>
      </div>

      <div class="lf-field">
        <label for="password2">Confirm password</label>
        <div class="lf-input">
          <input type="password" id="password2" name="password2" autocomplete="new-password"
                 placeholder="re-enter password" required />
        </div>
      </div>

      <button type="submit" class="btn-primary login-submit">Set password &amp; sign in&nbsp; →</button>
    </form>
  </div>
</div>

<script>
  (function () {
    var pw = document.getElementById('password');
    var t = document.getElementById('pw-toggle');
    if (!pw || !t) return;
    t.addEventListener('click', function () {
      var show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      t.textContent = show ? 'hide' : 'show';
    });
  })();
</script>

{% endblock %}
